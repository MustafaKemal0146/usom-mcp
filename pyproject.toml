[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usom-mcp"
dynamic = ["version"]
description = "MCP server exposing the Turkish national malicious-link list (USOM / T.C. Siber Güvenlik Başkanlığı) as threat intelligence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Mustafa Kemal Çıngıl" }]
keywords = ["mcp", "usom", "threat-intelligence", "phishing", "security", "turkey"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "fastmcp>=4.0,<5",
  "httpx>=0.27",
  "pydantic>=2.6",
  "platformdirs>=4.0",
  "idna>=3.6",
]

[project.urls]
Homepage = "https://github.com/MustafaKemal0146/usom-mcp"
Issues = "https://github.com/MustafaKemal0146/usom-mcp/issues"

[project.scripts]
usom-mcp = "usom_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.hatch.version]
path = "src/usom_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/usom_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real USOM API (set USOM_LIVE=1)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Turkish text legitimately contains dotless i and similar characters
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "SKILL.md", "LICENSE", "pyproject.toml"]
