name: Live API check

# Hits the real SGB/USOM API (read-only, a few requests). Kept out of the PR gate because the
# upstream service is slow and occasionally resets connections.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run pytest tests/integration -m live -q
        env:
          USOM_LIVE: "1"
